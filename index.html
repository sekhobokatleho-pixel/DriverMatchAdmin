<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriverMatch</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b7a4b"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#0b7a4b;--bd:#e3e6eb;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#2fbf80;--bd:#2a313b;--er:#ff7a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101317;--card:#1a1f26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#2fbf80;--bd:#2a313b;--er:#ff7a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{margin:6px 0 12px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px;margin:2px 0 8px}
input,select{width:100%;box-sizing:border-box;padding:10px;margin:0 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.row,.tabs{display:flex;gap:6px;margin:0 0 10px}.tabs{overflow-x:auto}.row button{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
a{color:var(--ac)}#msg{min-height:20px;margin:0 0 6px;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac);color:#fff;margin:0 6px 6px 0}
.hint{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:10px;margin:0 0 10px}
.card button{margin:0 0 8px}
</style></head><body><main>
<div id="msg"></div><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://wpqmqduwbqlrmhhtqsnw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwcW1xZHV3YnFscm1oaHRxc253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTMxMzksImV4cCI6MjEwNzk4OTEzOX0.eTHiQJyEJzE_gC4ZRTFnF3sV1Sknm1CqWy7_SfI8pFc');
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let user=null,role=null,mode='driver',tab='';
const note=(t,bad)=>{$('msg').textContent=t;$('msg').style.color=bad?'var(--er)':'var(--ac)'};

function authView(signup){
 app.innerHTML=`<h1>DriverMatch</h1>
 <div class="row"><button class="${mode=='driver'?'on':''}" onclick="mode='driver';authView(${signup})">I’m a driver</button><button class="${mode=='owner'?'on':''}" onclick="mode='owner';authView(${signup})">I’m an owner</button></div>
 <div class="card"><h2>${signup?'Create '+mode+' account':'Log in as '+mode}</h2>
 ${signup?'<input id="fn" placeholder="Full name"><input id="ph" placeholder="Phone" inputmode="tel">':''}
 ${signup&&mode=='driver'?'<select id="lt"><option>Code 8</option><option>Code 10</option><option>Code 14</option><option>Bike (A1/A)</option></select>':''}
 <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6)">${signup?`<label class="mut" style="display:flex;gap:8px;align-items:flex-start;margin:0 0 10px"><input id="ag" type="checkbox" style="width:auto;margin:3px 0 0"> <span>I am 18 or older and agree to the <a href="#" onclick="legal('terms',1,1);return false">Terms</a> and <a href="#" onclick="legal('privacy',1,1);return false">Privacy Policy</a>.</span></label>`:''}
 <button class="pri" onclick="${signup?'signUp()':'logIn()'}">${signup?'Sign up':'Log in'}</button>
 <p><a href="#" onclick="authView(${!signup});return false">${signup?'Have an account? Log in':'New here? Sign up'}</a></p><p class="mut" style="text-align:center"><a href="#" onclick="legal('terms',1,${!!signup});return false">Terms</a> · <a href="#" onclick="legal('privacy',1,${!!signup});return false">Privacy</a></p></div>`;
}
async function ensure(u){const m=u.user_metadata||{};
 let{data:p}=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();
 if(!p&&m.role){await sb.from('profiles').insert({id:u.id,role:m.role,email:u.email,full_name:m.full_name,phone:m.phone});
  if(m.role=='driver')await sb.from('driver_profiles').insert({user_id:u.id,licence_type:m.licence_type});p={role:m.role}}
 return p&&p.role}
async function signUp(){if(!$('ag').checked)return note('Please accept the Terms and Privacy Policy to sign up.',1);const m={role:mode,full_name:$('fn').value,phone:$('ph').value};
 if(mode=='driver')m.licence_type=$('lt').value;
 const{data,error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value,options:{data:m}});
 if(error)return note(error.message,1);
 if(data.session)return start(data.user);note('Check your email to confirm, then log in.')}
async function logIn(){const{data,error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
 if(error)return note(error.message,1);start(data.user)}
async function start(u){user=u;role=await ensure(u);
 if(!role||role!=mode){await sb.auth.signOut();user=null;return note(role?`This is a ${role} account. Use the ${role} login.`:'Could not load your profile.',1)}
 note('');tab=role=='driver'?'vehicle_cards':'driver_cards';listen();home()}
async function out(){if(chan)sb.removeChannel(chan);unread=0;try{const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}await sb.auth.signOut();user=null;note('');authView(false)}

let unread=0,chan=null,cchan=null;
const TABS=()=>[...(role=='driver'?[['vehicle_cards','Vehicles'],['profile','My offer']]:[['driver_cards','Drivers'],['vehicles','My vehicles']]),['requests','Requests'],['matches','Matches'],['documents','Docs'],['insurance','Insurance'],['notifications','Alerts']];
const drawTabs=()=>{$('tabs').innerHTML=TABS().map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';home()">${l}${k=='notifications'&&unread?` (${unread})`:''}</button>`).join('')};
async function unreadCount(){const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',user.id).eq('is_read',false);unread=count||0;drawTabs()}
function listen(){if(chan)sb.removeChannel(chan);chan=sb.channel('n'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},p=>{unread++;drawTabs();note('🔔 '+p.new.title)}).subscribe()}
async function home(){if(cchan){sb.removeChannel(cchan);cchan=null}
 app.innerHTML=`<div class="top"><b>DriverMatch · ${role}</b><button onclick="out()">Log out</button></div><div class="tabs" id="tabs"></div><div id="body">Loading…</div><p class="mut" style="text-align:center;margin-top:18px"><a href="#" onclick="legal('terms');return false">Terms</a> · <a href="#" onclick="legal('privacy');return false">Privacy</a></p>`;
 drawTabs();unreadCount();const e=await V[tab]();if(e)note(e.message,1)}
const empty=t=>`<p class="mut">${t}</p>`;
const V={
 async requests(){const{data,error}=await sb.from('requests').select('*').order('created_at',{ascending:false});if(error)return error;
  $('body').innerHTML=data.length?data.map(r=>`<div class="card"><b>Request ${esc(r.id.slice(0,8))}</b><div class="mut">${esc(r.status)} · started by ${esc(r.initiated_by)}</div>${r.status=='pending'&&r.initiated_by!=role?`<button class="pri" onclick="respond('${r.id}','accepted')">Accept</button> <button onclick="respond('${r.id}','declined')">Decline</button>`:''}</div>`).join(''):empty('No requests yet.')},
 async documents(){const[a,b]=await Promise.all([sb.from('documents').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),role=='owner'?sb.from('vehicles').select('id,make,model').eq('owner_id',user.id):{data:[]}]);if(a.error)return a.error;
  const T={driver:['id','licence','pdp','police_clearance','selfie_id'],owner:['id','proof_of_ownership','vehicle_photo']}[role];
  $('body').innerHTML=`<div class="card"><h2>Upload a document</h2><select id="dt">${T.map(t=>`<option>${t}</option>`).join('')}</select>${role=='owner'?`<select id="dv"><option value="">No vehicle</option>${(b.data||[]).map(v=>`<option value="${v.id}">${esc(v.make)} ${esc(v.model)}</option>`).join('')}</select>`:''}<input id="fl" type="file" accept="image/*,application/pdf"><button class="pri" onclick="upload()">Upload</button></div>`
  +a.data.map(d=>`<div class="card"><b>${esc(d.doc_type)}</b><div class="mut">${esc(d.status)}${d.admin_note?' · '+esc(d.admin_note):''}</div></div>`).join('')},
 async notifications(){const{data,error}=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error)return error;
  $('body').innerHTML=data.length?data.map(n=>`<div class="card"><b>${esc(n.title)}</b><div class="mut">${esc(n.body)}</div></div>`).join(''):empty('No alerts yet.')}
};
async function respond(id,s){const{error}=await sb.from('requests').update({status:s,responded_at:new Date().toISOString()}).eq('id',id);error?note(error.message,1):home()}
async function upload(){const f=$('fl').files[0];if(!f)return note('Choose a file first.',1);
 const path=`${user.id}/${Date.now()}_${f.name.replace(/[^\w.-]/g,'_')}`;
 const u=await sb.storage.from('documents').upload(path,f);if(u.error)return note(u.error.message,1);
 const{error}=await sb.from('documents').insert({user_id:user.id,vehicle_id:($('dv')||{}).value||null,doc_type:$('dt').value,file_path:path});
 error?note(error.message,1):(note('Uploaded. Waiting for admin approval.'),home())}

const CITIES=['Bloemfontein','Johannesburg','Pretoria','Cape Town','Durban','Gqeberha','East London','Polokwane','Mbombela','Kimberley','Welkom','Harrismith','Soweto','Pietermaritzburg','Rustenburg'];
const dl=`<datalist id="cities">${CITIES.map(c=>`<option value="${c}">`).join('')}</datalist>`;
const nz=s=>String(s||'').trim().toLowerCase(),rand=n=>'R'+Math.round(+n||0);
const where=x=>[x.suburb,x.city].filter(Boolean).map(esc).join(', ')||'Area not set';
let selVeh=null;

/* ---- Location: asked only when the user taps the button; saved rounded (~1 km) ---- */
let loc=null,radius=25;
const r2=n=>Math.round(n*100)/100;
const getLoc=()=>new Promise((ok,no)=>{
 if(!navigator.geolocation)return no(new Error('Location is not supported on this device. Type your area instead.'));
 navigator.geolocation.getCurrentPosition(p=>ok({lat:r2(p.coords.latitude),lng:r2(p.coords.longitude)}),
  e=>no(new Error(e.code==1?'Location permission was denied. Allow it in your browser settings, or type your area instead.':'Could not get your location. Try again, or type your area.')),
  {timeout:15000,maximumAge:300000})});
async function areaOf(l){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&lat=${l.lat}&lon=${l.lng}`);const a=(await r.json()).address||{};
 return{city:a.city||a.town||a.village||a.municipality||a.county||'',suburb:a.suburb||a.neighbourhood||a.city_district||a.quarter||''}}catch(e){return{city:'',suburb:''}}}
async function useLoc(){note('Getting your location…');
 try{const l=await getLoc(),a=await areaOf(l);loc={...l,...a};
  if($('ci'))$('ci').value=a.city;if($('su'))$('su').value=a.suburb;
  note(a.city?'Location found: '+[a.suburb,a.city].filter(Boolean).join(', ')+'. Check it, then save.':'Location found. Type your town/city, then save.')}
 catch(e){note(e.message,1)}}
const locSave=()=>loc?{lat:loc.lat,lng:loc.lng,location_consent:true,location_updated_at:new Date().toISOString()}:{};
const locBtn=`<button onclick="useLoc()">📍 Use my location</button><div class="mut">Your phone asks for permission first. Others only see your area and a rough distance, never exact coordinates.</div>`;
async function dists(fn,lat,lng){if(lat==null||lng==null)return{};const{data}=await sb.rpc(fn,{my_lat:lat,my_lng:lng});const m={};(data||[]).forEach(r=>m[r.id]=r.km);return m}
const near=(d,x,c)=>d!=null?(!radius||d<=radius):(!!c&&nz(x.city)==c);
const km=d=>d==null?'':` · ${d<1?'under 1':Math.round(d)} km away`;
const radSel=()=>`<select onchange="radius=+this.value;home()">${[5,10,25,50,0].map(r=>`<option value="${r}" ${r==radius?'selected':''}>${r?'Within '+r+' km':'Any distance'}</option>`).join('')}</select>`;
const byNear=(a,b)=>(b.area-a.area)||(b.fit-a.fit)||((a.d??1e9)-(b.d??1e9));

Object.assign(V,{
 async vehicle_cards(){const m=await sb.from('driver_profiles').select('weekly_offer,city,lat,lng').eq('user_id',user.id).maybeSingle(),me=m.data||{};
  const[l,dm]=await Promise.all([sb.from('vehicle_listings').select('*'),dists('vehicle_distances',me.lat,me.lng)]);if(l.error)return l.error;
  const offer=+me.weekly_offer||0,c=nz(me.city),has=me.lat!=null||!!c;
  const list=l.data.map(v=>{const d=dm[v.id];return{...v,d,area:near(d,v,c),fit:offer>0&&offer>=+v.weekly_amount}}).filter(v=>!radius||me.lat==null||v.area).sort(byNear);
  const n=list.filter(v=>v.area&&v.fit).length;
  $('body').innerHTML=(has?`${radSel()}<div class="hint"><b>${n}</b> vehicle${n==1?'':'s'} ${radius&&me.lat!=null?'within '+radius+' km':'near you'}${offer?' at or below your offer of '+rand(offer)+'/week':''}.</div>`:`<div class="hint">Turn on your location in <a href="#" onclick="tab='profile';home();return false">My offer</a> to see vehicles near you.</div>`)
  +(list.length?list.map(v=>`<div class="card">${v.area?'<span class="tag">Near you</span>':''}${v.fit?'<span class="tag">Fits your offer</span>':''}<div><b>${esc(v.make)} ${esc(v.model)}</b> ${esc(v.year)}</div><div class="mut">${esc(v.vehicle_type)} · ${esc(v.kms)} km · ${where(v)}${km(v.d)}</div><div>Owner asks <b>${rand(v.weekly_amount)}</b>/week</div><button class="pri" onclick="ask('${v.id}')">Request match</button></div>`).join(''):empty('No vehicles found. Try a wider distance.'))},
 async driver_cards(){const b=await sb.from('vehicles').select('id,make,model,weekly_amount,city,suburb,lat,lng').eq('owner_id',user.id),vs=b.data||[];
  if(!vs.length){$('body').innerHTML=empty('Add a vehicle first in the My vehicles tab. Drivers are matched to its area and weekly amount.');return}
  if(!vs.find(v=>v.id==selVeh))selVeh=vs[0].id;const v=vs.find(x=>x.id==selVeh),c=nz(v.city);
  const[a,dm,fn]=await Promise.all([sb.from('driver_listings').select('*'),dists('driver_distances',v.lat,v.lng),loadNames()]);if(a.error)return a.error;
  const list=a.data.map(d=>{const k=dm[d.id];return{...d,d:k,area:near(k,d,c),fit:+d.weekly_offer>=+v.weekly_amount}}).filter(d=>!radius||v.lat==null||d.area).sort(byNear);
  const n=list.filter(d=>d.area&&d.fit).length;
  $('body').innerHTML=`<select onchange="selVeh=this.value;home()">${vs.map(x=>`<option value="${x.id}" ${x.id==selVeh?'selected':''}>${esc(x.make)} ${esc(x.model)} · ${rand(x.weekly_amount)}/week</option>`).join('')}</select>${v.lat!=null||c?radSel():''}<div class="hint"><b>${n}</b> driver${n==1?'':'s'} ${radius&&v.lat!=null?'within '+radius+' km':'in '+esc(v.city||'your area')} willing to pay ${rand(v.weekly_amount)}/week or more.${v.lat==null?' Tap “Update location” on the vehicle in My vehicles to match by distance.':''}</div>`
  +(list.length?list.map(d=>`<div class="card">${d.area?'<span class="tag">Near you</span>':''}${d.fit?'<span class="tag">Meets your price</span>':''}<div><b>${esc(fn[d.id]||d.driver_code)}</b> · ${esc(d.licence_type)}</div><div class="mut">${where(d)}${km(d.d)} · Documents verified</div><div>Offers <b>${d.weekly_offer?rand(d.weekly_offer):'not set'}</b>/week</div><button class="pri" onclick="ask('${d.id}')">Request match</button></div>`).join(''):empty('No verified drivers found. Try a wider distance.'))},
 async profile(){const{data,error}=await sb.from('driver_profiles').select('*').eq('user_id',user.id).maybeSingle();if(error)return error;const p=data||{};
  $('body').innerHTML=`${dl}<div class="card"><h2>My weekly offer and area</h2><div class="mut">Owners near you are told when your offer fits their price, before you pay. Status: ${esc(p.verification_status||'pending')}</div><input id="wo" type="number" placeholder="Weekly amount I’m willing to pay (R)" value="${esc(p.weekly_offer)}">${locBtn}${p.lat!=null?'<div class="mut">Location saved ✓</div>':''}<input id="ci" list="cities" placeholder="Town / city" value="${esc(p.city)}"><input id="su" placeholder="Suburb / township (optional)" value="${esc(p.suburb)}"><button class="pri" onclick="saveProfile()">Save</button></div>`},
 async vehicles(){const{data,error}=await sb.from('vehicles').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return error;
  $('body').innerHTML=`${dl}<div class="card"><h2>Add a vehicle</h2><select id="vt"><option>car</option><option>bike</option></select><input id="mk" placeholder="Make"><input id="md" placeholder="Model"><input id="yr" type="number" placeholder="Year"><input id="km" type="number" placeholder="Kms"><input id="wk" type="number" placeholder="Weekly amount I want to collect (R)">${locBtn}<input id="ci" list="cities" placeholder="Town / city where it is"><input id="su" placeholder="Suburb / township (optional)"><button class="pri" onclick="addVehicle()">Add vehicle</button></div>`
  +data.map(v=>`<div class="card"><b>${esc(v.make)} ${esc(v.model)}</b> ${esc(v.year)}<div class="mut">${esc(v.vehicle_code)} · ${esc(v.kms)} km · ${where(v)}${v.lat!=null?' · 📍':''} · ${esc(v.status)}</div><div>Collecting <b>${rand(v.weekly_amount)}</b>/week</div><button onclick="editV('${v.id}',${+v.weekly_amount||0})">Change price</button> <button onclick="editArea('${v.id}')">Update location</button></div>`).join('')}
});
async function saveProfile(){const{error}=await sb.from('driver_profiles').update({weekly_offer:+$('wo').value||null,city:$('ci').value.trim(),suburb:$('su').value.trim(),...locSave()}).eq('user_id',user.id);
 error?note(error.message,1):(loc=null,note('Saved.'),home())}
async function addVehicle(){if(!$('ci').value.trim()||!+$('wk').value)return note('Add the weekly amount and the town/city.',1);
 const{error}=await sb.from('vehicles').insert({owner_id:user.id,vehicle_type:$('vt').value,make:$('mk').value,model:$('md').value,year:+$('yr').value||null,kms:+$('km').value||null,weekly_amount:+$('wk').value,city:$('ci').value.trim(),suburb:$('su').value.trim(),...locSave()});
 error?note(error.message,1):(loc=null,note('Vehicle added. It will show once approved.'),home())}
async function editV(id,cur){const p=prompt('New weekly amount (R)',cur);if(p===null||!+p)return;const{error}=await sb.from('vehicles').update({weekly_amount:+p}).eq('id',id);error?note(error.message,1):home()}
async function editArea(id){note('Getting your location…');let u;
 try{const l=await getLoc(),a=await areaOf(l);u={lat:l.lat,lng:l.lng,city:a.city,suburb:a.suburb,location_consent:true,location_updated_at:new Date().toISOString()}}
 catch(e){note(e.message,1);const c=prompt('Type the town / city instead');if(!c)return;u={city:c.trim(),suburb:(prompt('Suburb / township (optional)')||'').trim()}}
 Object.keys(u).forEach(k=>u[k]===''&&delete u[k]);
 const{error}=await sb.from('vehicles').update(u).eq('id',id);error?note(error.message,1):(note('Location updated.'),home())}
async function ask(id){const r=role=='driver'?{driver_id:user.id,vehicle_id:id}:{driver_id:id,vehicle_id:selVeh};
 if(!r.vehicle_id)return note('Add a vehicle first.',1);
 const{error}=await sb.from('requests').insert({...r,initiated_by:role});note(error?error.message:'Request sent.',!!error)}
/* ---- Alerts, matches, chat, ratings, insurance ---- */
const bub=m=>`<div style="text-align:${m.sender_id==user.id?'right':'left'};margin:0 0 6px"><span class="tag" style="background:${m.sender_id==user.id?'var(--ac)':'var(--mut)'};white-space:pre-wrap;font-size:14px">${esc(m.body)}</span></div>`;
let chatReq=null,offers=[],alerts=[],showPast=false,showPastReq=false,showOld=false;
async function loadNames(){if(role!='owner')return{};try{const{data}=await sb.rpc('driver_first_names');const m={};(data||[]).forEach(x=>m[x.id]=x.first_name);return m}catch(e){return{}}}
Object.assign(V,{
 async requests(){const{data,error}=await sb.from('requests').select('*').in('status',['pending','declined']).order('created_at',{ascending:false});if(error)return error;const fn=await loadNames();
  const card=r=>`<div class="card"><b>Request · ${esc(fn[r.driver_id]||r.id.slice(0,8))}</b><div class="mut">${esc(r.status)} · started by ${esc(r.initiated_by)}</div>${r.status=='pending'&&r.initiated_by!=role?`<button class="pri" onclick="respond('${r.id}','accepted')">Accept</button> <button onclick="respond('${r.id}','declined')">Decline</button>`:''}</div>`,
   open=data.filter(r=>r.status=='pending'),past=data.filter(r=>r.status!='pending');
  $('body').innerHTML=(open.length?open.map(card).join(''):empty('No open requests. Accepted ones move to Matches.'))+(past.length?`<button onclick="showPastReq=!showPastReq;home()">${showPastReq?'Hide':'Show'} past requests (${past.length})</button>`:'')+(showPastReq?past.map(card).join(''):'')},
 async matches(){const[a,rt]=await Promise.all([sb.from('requests').select('*').eq('status','accepted').order('created_at',{ascending:false}),sb.from('ratings').select('request_id').eq('rater_id',user.id)]);if(a.error)return a.error;
  const done=new Set((rt.data||[]).map(x=>x.request_id)),act=a.data,fn=await loadNames(),nm=r=>esc(fn[r.driver_id]||r.id.slice(0,8));
  $('body').innerHTML=(act.length?act.map(r=>`<div class="card"><span class="tag">Active match</span><div><b>${nm(r)}</b></div><div class="mut">Agree your terms in chat. Phone numbers stay hidden.</div><button class="pri" onclick="openChat('${r.id}')">💬 Chat</button> ${done.has(r.id)?'':`<button onclick="rate('${r.id}')">⭐ Rate</button> `}<button onclick="cancelMatch('${r.id}')">Cancel match</button></div>`).join(''):empty('No active matches yet. Accepted requests appear here.'))
},
 async notifications(){const{data,error}=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(error)return error;
  alerts=data;const ps=await pushState();$('body').innerHTML=pushBanner(ps)+(unread?'<button onclick="readAll()">Mark all as read</button>':'')+(()=>{const week=Date.now()-7*864e5,card=n=>`<div class="card" style="cursor:pointer;${n.is_read?'':'border-color:var(--ac)'}" onclick="openAlert('${n.id}')"><b>${esc(n.title)}</b>${n.link_type?' <span class="mut">›</span>':''}<div class="mut">${esc(n.body)}</div><div class="mut">${new Date(n.created_at).toLocaleString()}</div></div>`,
  fresh=data.filter(n=>!n.is_read||new Date(n.created_at)>week),old=data.filter(n=>!fresh.includes(n));
  return(fresh.length?fresh.map(card).join(''):empty('No new alerts.'))+(old.length?`<button onclick="showOld=!showOld;home()">${showOld?'Hide':'Show'} older alerts (${old.length})</button>`:'')+(showOld?old.map(card).join(''):'')})()},
 async insurance(){const{data,error}=await sb.from('insurance_offers').select('*').eq('active',true).order('monthly_from');if(error)return error;offers=data;
  $('body').innerHTML='<div class="hint">Compare cover from partner insurers. These are adverts, so check the terms before you buy.</div>'+(data.length?data.map(o=>`<div class="card"><span class="tag">${esc(o.cover_type)}</span><div><b>${esc(o.company)}</b> · ${esc(o.title)}</div><div class="mut">${esc(o.details)}</div><div>From <b>${rand(o.monthly_from)}</b>/month</div><button class="pri" onclick="quote('${o.id}')">Get a quote</button></div>`).join(''):empty('No insurance offers yet.'))}
});
async function openAlert(id){const n=alerts.find(a=>a.id==id);if(!n)return;
 if(!n.is_read){n.is_read=true;if(unread>0)unread--;sb.from('notifications').update({is_read:true}).eq('id',id).then(()=>{})}
 const t=n.link_type;if(!t){drawTabs();return V.notifications()}
 if(t=='chat'&&n.link_id){tab='matches';await home();return openChat(n.link_id)}
 if(TABS().some(x=>x[0]==t)){tab=t;return home()}
 drawTabs();V.notifications()}
async function readAll(){await sb.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);unread=0;home()}
async function quote(id){const{error}=await sb.from('insurance_leads').insert({offer_id:id,user_id:user.id});if(error)return note(error.message,1);
 note('Quote request sent to the insurer.');const l=(offers.find(o=>o.id==id)||{}).link;if(l&&/^(https?:|mailto:|tel:)/i.test(l))window.open(l,'_blank')}
function cancelMatch(id){if(cchan){sb.removeChannel(cchan);cchan=null}
 $('body').innerHTML=`<button onclick="home()">← Back</button><div class="card" style="margin-top:10px"><h2>Cancel this match?</h2><div class="mut">The chat is deleted for both of you and the match disappears. You will both need to pay again to send new requests.</div><select id="cr"><option value="">Why are you cancelling?</option><option>No response or no-show</option><option>Price or terms changed</option><option>Vehicle or driver not as described</option><option>Found another match</option><option>Changed my mind</option><option>Other</option></select><button class="pri" onclick="confirmCancel('${id}')">Cancel match</button></div>`}
async function confirmCancel(id){const r=$('cr').value;if(!r)return note('Choose a reason first.',1);
 const{error}=await sb.rpc('cancel_match',{p_request_id:id,p_reason:r});if(error)return note(error.message,1);
 chatReq=null;tab='matches';note('Match cancelled and removed.');home()}
async function rate(id){const s=Math.round(+prompt('Rate 1 to 5 stars'));if(!(s>=1&&s<=5))return;
 const{error}=await sb.rpc('submit_rating',{rid:id,n_stars:s,cmt:prompt('Comment (optional)')||''});error?note(error.message,1):(note('Thanks for rating.'),home())}
async function refreshChat(){const{data}=await sb.from('chat_messages').select('*').eq('request_id',chatReq).order('created_at');
 if($('chat')){$('chat').innerHTML=(data||[]).map(bub).join('')||'<p class="mut">No messages yet. Say hi 👋</p>';$('chat').scrollTop=1e9}}
async function openChat(id){chatReq=id;
 $('body').innerHTML='<button onclick="tab=\'matches\';home()">← Back</button> <button onclick="cancelMatch(chatReq)">Cancel match</button><div id="chat" class="card" style="max-height:55vh;overflow:auto;margin-top:10px"></div><input id="cm" placeholder="Type a message"><button class="pri" onclick="sendChat()">Send</button>';
 await refreshChat();
 cchan=sb.channel('c'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'request_id=eq.'+id},refreshChat).subscribe()}
async function sendChat(){const t=$('cm').value.trim();if(!t)return;
 if(/\d[\s\-().]*\d[\s\-().]*\d[\s\-().]*\d[\s\-().]*\d[\s\-().]*\d[\s\-().]*\d[\s\-().]*\d[\s\-().]*\d/.test(t))return note('Phone numbers can’t be shared in chat.',1);
 const{error}=await sb.from('chat_messages').insert({request_id:chatReq,sender_id:user.id,body:t});if(error)return note(error.message,1);$('cm').value='';note('');refreshChat()}

const u8=t=>{const r=atob((t+'='.repeat((4-t.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushState(){if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window))return 'unsupported';if(Notification.permission=='denied')return 'denied';
 const reg=await navigator.serviceWorker.getRegistration();return reg&&await reg.pushManager.getSubscription()?'on':'off'}
const pushBanner=s=>s=='off'?'<div class="hint">Get alerts on your phone even when the app is closed.<br><br><button class="pri" onclick="enablePush()">🔔 Turn on phone notifications</button></div>':s=='unsupported'?'<div class="hint">For phone notifications, add DriverMatch to your Home Screen first (iPhone: Safari → Share → Add to Home Screen), then open it from there.</div>':s=='denied'?'<div class="hint">Notifications are blocked. Allow them for this app in your phone settings.</div>':'';
async function enablePush(){try{if(await Notification.requestPermission()!='granted')return note('Notifications were not allowed.',1);
 const reg=await navigator.serviceWorker.getRegistration();if(!reg)return note('Reload the app and try again.',1);
 const j=(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)})).toJSON();
 const{error}=await sb.from('push_subscriptions').upsert({user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
 error?note(error.message,1):(note('Phone notifications are on.'),home())}catch(e){note(e.message,1)}}
