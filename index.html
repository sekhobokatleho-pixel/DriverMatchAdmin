<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriverMatch Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#0f7a4a;--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e0e5ec;--rd:#c0392b;--am:#b7791f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:12px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.err{color:var(--rd);margin:8px 0;font-size:15px}
.ok{color:var(--g);margin:8px 0;font-size:15px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;margin:6px 0;font-family:inherit}
button{font-size:16px;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:10px 14px;cursor:pointer;color:var(--tx)}
button.p{background:var(--g);color:#fff;border-color:var(--g)}
button.d{background:var(--rd);color:#fff;border-color:var(--rd)}
button.w{background:var(--am);color:#fff;border-color:var(--am)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px 2px;font-size:13px}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.subs{display:flex;gap:6px;margin:8px 0 12px}
.subs button{flex:1;padding:8px 4px;font-size:14px}
.subs button.on{background:#e6f4ec;border-color:var(--g);color:var(--g);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card.click{cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:#eef1f5;color:var(--mu);margin-right:4px}
.tag.pending,.tag.open,.tag.disabled{background:#fdf3dc;color:var(--am)}
.tag.approved,.tag.resolved,.tag.active{background:#e6f4ec;color:var(--g)}
.tag.rejected,.tag.blocked{background:#fbe6e3;color:var(--rd)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:15px;margin:8px 0}
.kv span:nth-child(odd){color:var(--mu)}
.doc{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.doc img{max-width:100%;border-radius:8px;margin-top:8px;display:block}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer}
.stat .n{font-size:28px;font-weight:700}
.stat.static{cursor:default}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ====== CONFIG ====== */
const SUPABASE_URL = 'https://wpqmqduwbqlrmhhtqsnw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwcW1xZHV3YnFscm1oaHRxc253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTMxMzksImV4cCI6MjEwNzk4OTEzOX0.eTHiQJyEJzE_gC4ZRTFnF3sV1Sknm1CqWy7_SfI8pFc';
const DOC_BUCKET = 'documents';
const ADMIN_EMAIL = 'sekhobokatleho@gmail.com';
/* ==================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const S = { mt:'', mb:'', ma:'all', page:'dash', who:'drivers', sec:'pending', openId:null, data:null, msg:'', msgType:'err', rsec:'open', tid:null, uid:null, q:'', swho:'drivers' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => { s = (s || 'pending').toLowerCase(); if (['approved','verified'].includes(s)) return 'approved'; if (s === 'rejected') return 'rejected'; return 'pending'; };
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-ZA') : '';
function flash(m, t){ S.msg = m; S.msgType = t || 'err'; }

/* ---------- login ---------- */
function renderLogin(err){
  app.innerHTML = `
    <div class="top"><h1>DriverMatch Admin</h1></div>
    <div class="card">
      <input id="em" type="email" placeholder="Admin email" autocomplete="username" value="${esc(ADMIN_EMAIL)}">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err">${esc(err || '')}</div>
      <button class="p" id="go">Log in</button>
    </div>`;
  document.getElementById('go').onclick = async () => {
    const email = document.getElementById('em').value.trim();
    const password = document.getElementById('pw').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return renderLogin(error.message);
    start();
  };
}

/* ---------- data ---------- */
async function loadAll(){
  const [dp, pr, vh, dc, tk, us, mt] = await Promise.all([
    sb.from('driver_profiles').select('*'),
    sb.from('profiles').select('id,full_name,phone,email,role,age,address,onboarded,onboarding_submitted_at'),
    sb.from('vehicles').select('*'),
    sb.from('documents').select('*').order('created_at', { ascending:false }),
    sb.from('support_tickets').select('*').order('created_at', { ascending:false }),
    sb.from('user_status').select('*'),
    sb.from('matches').select('*')
  ]);
  const bad = [dp, pr, vh, dc].find(r => r.error);
  if (bad) throw new Error(bad.error.message);
  const profiles = {}; pr.data.forEach(p => profiles[p.id] = p);
  const status = {}; (us.error ? [] : us.data).forEach(s => status[s.user_id] = s);
  S.data = { drivers: dp.data, vehicles: vh.data, docs: dc.data, profiles,
    tickets: tk.error ? [] : tk.data, status, matches: mt.error ? null : mt.data };
}

/* ---------- shell + nav ---------- */
function openTickets(){ return (S.data?.tickets || []).filter(t => (t.status || 'open') !== 'resolved').length; }
function shell(html){
  const n = openTickets();
  const tabs = [['dash','Dashboard' + (obPending().length ? ` (${obPending().length})` : '')],['people','People'],['reports','Reports' + (n ? ` (${n})` : '')],['messages','Messages'],['settings','Settings']];
  app.innerHTML = `
    <div class="top"><h1>DriverMatch Admin</h1><button id="out">Log out</button></div>
    <div class="tabs">${tabs.map(([k,l]) => `<button data-p="${k}" class="${S.page===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="${S.msgType}">${esc(S.msg)}</div>
    ${html}`;
  document.getElementById('out').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => go(b.dataset.p));
}
function go(p, f){ S.obid = null; S.page = p; S.msg = ''; S.openId = null; S.tid = null; S.uid = null; S.sstat = f || ''; render(); }
function render(){
  if (S.page === 'dash') return renderDash();
  if (S.page === 'obreview') return renderObReview();
  if (S.page === 'matchlist') return renderMatches();
  if (S.page === 'reports') return renderReports();
  if (S.page === 'messages') return renderMessages();
  if (S.page === 'settings') return renderSettings();
  return renderList();
}

/* ---------- dashboard ---------- */
function renderDash(){
  const D = S.data, dr = items('drivers'), ve = items('owners');
  const c = (arr, k) => arr.filter(i => i.status === k).length;
  const owners = new Set(D.vehicles.map(v => v.owner_id)).size;
  const tk = D.tickets, st = Object.values(D.status);
  const stat = (n, l, go) => `<div class="stat ${go ? '' : 'static'}" ${go ? `data-go="${go}"` : ''}><div class="n">${n}</div><div class="mu">${l}</div></div>`;
  let matchHtml = '';
  if (D.matches) {
    const by = {}; D.matches.forEach(m => { const k = m.status || 'unknown'; by[k] = (by[k] || 0) + 1; });
    matchHtml = `<h2>Matches</h2><div class="grid">${stat(D.matches.length, 'Total matches', 'matches:all')}${Object.entries(by).map(([k,v]) => stat(v, esc(k), 'matches:' + k)).join('')}</div>`;
  }
  shell(`
    <h2>New signups</h2>
    <div class="grid">
      ${stat(obPending().length, 'Waiting for onboarding review', 'obreview:list')}
    </div>
    <h2>Drivers</h2>
    <div class="grid">
      ${stat(dr.length, 'Total drivers', 'drivers:all')}
      ${stat(c(dr,'pending'), 'Pending', 'drivers:pending')}
      ${stat(c(dr,'approved'), 'Approved', 'drivers:approved')}
      ${stat(c(dr,'rejected'), 'Rejected', 'drivers:rejected')}
    </div>
    <h2>Owners</h2>
    <div class="grid">
      ${stat(owners, 'Total owners', 'owners:all')}
      ${stat(ve.length, 'Total vehicles', 'owners:all')}
      ${stat(c(ve,'pending'), 'Vehicles pending', 'owners:pending')}
      ${stat(c(ve,'approved'), 'Vehicles approved', 'owners:approved')}
      ${stat(c(ve,'rejected'), 'Vehicles rejected', 'owners:rejected')}
    </div>
    ${matchHtml}
    <h2>Support & accounts</h2>
    <div class="grid">
      ${stat(tk.filter(t => (t.status||'open') !== 'resolved').length, 'Open reports', 'reports:open')}
      ${stat(tk.filter(t => t.status === 'resolved').length, 'Resolved reports', 'reports:resolved')}
      ${stat(st.filter(s => s.status === 'disabled').length, 'Disabled users', 'users:disabled')}
      ${stat(st.filter(s => s.status === 'blocked').length, 'Blocked users', 'users:blocked')}
    </div>`);
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => {
    const [w, s] = el.dataset.go.split(':');
    if (w === 'obreview') return go('obreview');
    if (w === 'reports') { S.rsec = s || 'open'; return go('reports'); }
    if (w === 'users') return go('settings', s);
    if (w === 'matches') { S.msec = s; return go('matchlist'); }
    S.who = w; S.sec = s; go('people');
  });
}

function renderMatches(){
  const D = S.data, all = D.matches || [], st = m => m.status || 'unknown';
  const ks = ['all', ...new Set(all.map(st))];
  const list = S.msec === 'all' ? all : all.filter(m => st(m) === S.msec);
  const nm = id => D.profiles[id]?.full_name;
  shell(`<button id="bk">← Dashboard</button><h2>Matches</h2>
    <div class="subs">${ks.map(k => `<button data-m="${esc(k)}" class="${S.msec===k?'on':''}">${esc(k)} (${k==='all' ? all.length : all.filter(m => st(m)===k).length})</button>`).join('')}</div>
    ${list.length ? list.map(m => `<div class="card"><div class="row"><b>${esc([nm(m.driver_id), nm(m.owner_id)].filter(Boolean).join(' ↔ ') || 'Match')}</b><span class="tag">${esc(st(m))}</span></div><div class="mu">${m.created_at ? fmtDate(m.created_at) : ''}</div></div>`).join('') : '<div class="mu">No matches here.</div>'}`);
  document.getElementById('bk').onclick = () => go('dash');
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.msec = b.dataset.m; renderMatches(); });
}

/* ---------- people (drivers / owners) ---------- */
function items(who){
  who = who || S.who;
  const D = S.data;
  if (who === 'drivers') {
    return D.drivers.map(d => ({
      id: d.user_id, status: norm(d.verification_status), reason: d.rejection_reason,
      title: D.profiles[d.user_id]?.full_name || d.driver_code || 'Driver',
      code: d.driver_code, place: [d.suburb, d.city].filter(Boolean).join(', '), raw: d
    }));
  }
  return D.vehicles.map(v => ({
    id: v.id, status: norm(v.status), reason: v.rejection_reason,
    title: `${v.vehicle_code || 'Vehicle'} · ${[v.make, v.model, v.year].filter(Boolean).join(' ')}`,
    owner: D.profiles[v.owner_id]?.full_name || 'Owner', code: v.vehicle_code,
    place: [v.suburb, v.city].filter(Boolean).join(', '), raw: v
  }));
}

function renderList(){
  const all = items();
  const count = k => k === 'all' ? all.length : all.filter(i => i.status === k).length;
  const list = S.sec === 'all' ? all : all.filter(i => i.status === S.sec);
  shell(`
    <div class="tabs">
      <button data-w="drivers" class="${S.who==='drivers'?'on':''}">Drivers</button>
      <button data-w="owners" class="${S.who==='owners'?'on':''}">Owners</button>
    </div>
    <div class="subs">
      ${['all','pending','approved','rejected'].map(k => `<button data-s="${k}" class="${S.sec===k?'on':''}">${k[0].toUpperCase()+k.slice(1)} (${count(k)})</button>`).join('')}
    </div>
    ${list.length ? list.map(i => `
      <div class="card click" data-id="${esc(i.id)}">
        <div class="row"><b>${esc(i.title)}</b><span class="tag ${i.status}">${i.status}</span></div>
        ${S.who==='owners' ? `<div class="mu">Owner: ${esc(i.owner)}</div>` : ''}
        <div class="mu">${esc(i.place || 'No location')}</div>
      </div>`).join('') : `<div class="mu">Nothing in ${S.sec}.</div>`}
  `);
  app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { S.who = b.dataset.w; S.msg=''; renderList(); });
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.sec = b.dataset.s; S.msg=''; renderList(); });
  app.querySelectorAll('[data-id]').forEach(c => c.onclick = () => { S.openId = c.dataset.id; S.msg=''; renderDetail(); });
}

async function renderDetail(){
  const D = S.data;
  const it = items().find(i => String(i.id) === String(S.openId));
  if (!it) { S.openId = null; return renderList(); }
  let docs, kv;
  if (S.who === 'drivers') {
    const p = D.profiles[it.raw.user_id] || {};
    docs = D.docs.filter(d => d.user_id === it.raw.user_id);
    kv = [['Name', p.full_name], ['Age', p.age], ['Address', p.address], ['Phone', p.phone], ['Email', p.email], ['Driver code', it.raw.driver_code],
          ['Licence', it.raw.licence_type], ['Location', it.place], ['Weekly offer', it.raw.weekly_offer ? 'R' + it.raw.weekly_offer : ''],
          ['Joined', fmtDate(it.raw.created_at)]];
  } else {
    const v = it.raw, p = D.profiles[v.owner_id] || {};
    docs = D.docs.filter(d => d.vehicle_id === v.id || (d.user_id === v.owner_id && !d.vehicle_id));
    kv = [['Owner', p.full_name], ['Age', p.age], ['Address', p.address], ['Phone', p.phone], ['Email', p.email], ['Vehicle', `${v.vehicle_code || ''} (${v.vehicle_type || ''})`],
          ['Make / model', [v.make, v.model, v.year].filter(Boolean).join(' ')], ['Kms', v.kms], ['Location', it.place],
          ['Weekly amount', v.weekly_amount ? 'R' + v.weekly_amount : '']];
  }
  app.innerHTML = `
    <div class="top"><button id="back">← Back</button><span class="tag ${it.status}">${it.status}</span></div>
    <h2>${esc(it.title)}</h2>
    <div class="card"><div class="kv">${kv.map(([k,v]) => `<span>${esc(k)}</span><span>${esc(v || '—')}</span>`).join('')}</div>
      ${it.reason ? `<div class="err">Reason: ${esc(it.reason)}</div>` : ''}</div>
    <h2>Documents (${docs.length})</h2>
    <div id="docs"><div class="mu">Loading documents…</div></div>
    <div class="${S.msgType}" id="msg">${esc(S.msg)}</div>
    <div class="card">
      <textarea id="why" rows="2" placeholder="Reason (required for rejecting or revoking)"></textarea>
      <div class="acts">
        ${it.status !== 'approved' ? '<button class="p" id="ap">Approve</button>' : ''}
        ${it.status === 'approved' ? '<button class="d" id="rv">Revoke</button>' : ''}
        ${it.status === 'pending' ? '<button class="d" id="rj">Reject</button>' : ''}
      </div>
    </div>`;
  document.getElementById('back').onclick = () => { S.openId = null; S.msg=''; renderList(); };

  const showMsg = m => { const e = document.getElementById('msg'); e.className = 'err'; e.textContent = m; };
  const setStatus = async (status, needReason) => {
    const reason = document.getElementById('why').value.trim();
    if (needReason && !reason) return showMsg('Please type a reason first.');
    const patch = S.who === 'drivers'
      ? { verification_status: status, rejection_reason: status === 'approved' ? null : reason }
      : { status: status, rejection_reason: status === 'approved' ? null : reason };
    const q = S.who === 'drivers'
      ? sb.from('driver_profiles').update(patch).eq('user_id', it.raw.user_id)
      : sb.from('vehicles').update(patch).eq('id', it.raw.id);
    const { data, error } = await q.select();
    if (error) return showMsg(error.message);
    if (!data || !data.length) return showMsg('Update was blocked. The admin policy is missing (run the SQL).');
    await loadAll();
    S.sec = status; S.openId = null;
    flash(`Moved to ${status}.`, 'ok');
    renderList();
  };
  const ap = document.getElementById('ap'), rj = document.getElementById('rj'), rv = document.getElementById('rv');
  if (ap) ap.onclick = () => setStatus('approved', false);
  if (rj) rj.onclick = () => setStatus('rejected', true);
  if (rv) rv.onclick = () => setStatus('rejected', true);

  const box = document.getElementById('docs');
  if (!docs.length) { box.innerHTML = '<div class="mu">No documents uploaded.</div>'; return; }
  const parts = await Promise.all(docs.map(async d => {
    const { data, error } = await sb.storage.from(DOC_BUCKET).createSignedUrl(d.file_path, 900);
    const url = data?.signedUrl;
    const isImg = /\.(jpe?g|png|gif|webp)$/i.test(d.file_path || '');
    return `<div class="doc">
      <div class="row"><b>${esc((d.doc_type || 'document').replace(/_/g,' '))}${d.label ? ' · ' + esc(d.label) : ''}</b><span class="mu">${fmtDate(d.created_at)}</span></div>
      ${error ? `<div class="err">Cannot open file: ${esc(error.message)}</div>` :
        (isImg ? `<a href="${url}" target="_blank"><img src="${url}" alt="document"></a>` : `<a href="${url}" target="_blank">Open file</a>`)}
    </div>`;
  }));
  box.innerHTML = parts.join('');
}

function obPending(){ return Object.values(S.data?.profiles || {}).filter(p => p.onboarding_submitted_at && !p.onboarded); }
async function renderObReview(){
  const D = S.data, list = obPending();
  if (!S.obid) {
    shell(`<h2>Onboarding to review</h2>${list.length ? list.map(p => `<div class="card" style="cursor:pointer" data-o="${p.id}"><div class="row"><b>${esc(p.full_name || 'User')}</b><span class="tag pending">${esc(p.role || '')}</span></div><div class="mu">Submitted ${fmtDate(p.onboarding_submitted_at)}</div></div>`).join('') : '<div class="mu">Nobody is waiting for review.</div>'}`);
    app.querySelectorAll('[data-o]').forEach(el => el.onclick = () => { S.obid = el.dataset.o; renderObReview(); });
    return;
  }
  const p = D.profiles[S.obid];
  if (!p) { S.obid = null; return renderObReview(); }
  const docs = D.docs.filter(d => d.user_id === p.id && !d.vehicle_id);
  shell(`<button id="bk">← Back</button><h2>${esc(p.full_name || 'User')}</h2>
    <div class="card"><div class="kv"><span>Role</span><span>${esc(p.role || '—')}</span><span>Age</span><span>${esc(p.age || '—')}</span><span>Address</span><span>${esc(p.address || '—')}</span><span>Phone</span><span>${esc(p.phone || '—')}</span><span>Email</span><span>${esc(p.email || '—')}</span></div></div>
    <h2>Documents (${docs.length})</h2><div id="docs"><div class="mu">Loading documents…</div></div>
    <div class="err" id="msg"></div>
    <div class="card"><textarea id="why" rows="2" placeholder="Reason (required for rejecting)"></textarea>
      <div class="acts"><button class="p" id="ap">Approve</button><button class="d" id="rj">Reject</button></div>
      <div class="mu" style="margin-top:10px">Approve lets them into the app. Reject sends them back to upload their documents again, with your reason.</div></div>`);
  document.getElementById('bk').onclick = () => { S.obid = null; renderObReview(); };
  const review = async ok => {
    const why = document.getElementById('why').value.trim(), m = document.getElementById('msg');
    if (!ok && !why) { m.textContent = 'Please type a reason first.'; return; }
    const { error } = await sb.rpc('admin_review_onboarding', { p_user: p.id, p_approve: ok, p_reason: ok ? null : why });
    if (error) { m.textContent = error.message.includes('function') ? 'Run admin_onboarding.sql in Supabase first.' : error.message; return; }
    await loadAll(); S.obid = null;
    flash(ok ? 'Approved. They can enter the app.' : 'Rejected. They must upload again.', 'ok'); renderObReview();
  };
  document.getElementById('ap').onclick = () => review(true);
  document.getElementById('rj').onclick = () => review(false);
  const box = document.getElementById('docs');
  if (!docs.length) { box.innerHTML = '<div class="mu">No documents uploaded.</div>'; return; }
  box.innerHTML = (await Promise.all(docs.map(async d => {
    const { data, error } = await sb.storage.from(DOC_BUCKET).createSignedUrl(d.file_path, 900);
    const url = data?.signedUrl, isImg = /\.(jpe?g|png|gif|webp)$/i.test(d.file_path || '');
    return `<div class="doc"><div class="row"><b>${esc((d.doc_type || 'document').replace(/_/g,' '))}</b><span class="mu">${fmtDate(d.created_at)}</span></div>${error ? `<div class="err">Cannot open file: ${esc(error.message)}</div>` : (isImg ? `<a href="${url}" target="_blank"><img src="${url}" alt="document"></a>` : `<a href="${url}" target="_blank">Open file</a>`)}</div>`;
  }))).join('');
}

/* ---------- reports / support ---------- */
function renderReports(){
  if (S.tid) return renderTicket();
  const D = S.data;
  const isRes = t => t.status === 'resolved';
  const nOpen = D.tickets.filter(t => !isRes(t)).length, nRes = D.tickets.length - nOpen;
  const list = D.tickets.filter(t => S.rsec === 'resolved' ? isRes(t) : !isRes(t));
  shell(`
    <div class="subs">
      <button data-r="open" class="${S.rsec==='open'?'on':''}">Open (${nOpen})</button>
      <button data-r="resolved" class="${S.rsec==='resolved'?'on':''}">Resolved (${nRes})</button>
    </div>
    ${list.length ? list.map(t => {
      const p = D.profiles[t.user_id] || {};
      return `<div class="card click" data-t="${esc(t.id)}">
        <div class="row"><b>${esc(t.subject || 'Issue')}</b><span class="tag ${esc(t.status || 'open')}">${esc(t.status || 'open')}</span></div>
        <div class="mu">${esc(p.full_name || 'User')} · ${esc(t.user_role || p.role || '')} · ${fmtDate(t.created_at)}</div>
        <div class="mu">${esc((t.message || '').slice(0, 90))}</div></div>`;
    }).join('') : '<div class="mu">No reports here.</div>'}`);
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.rsec = b.dataset.r; renderReports(); });
  app.querySelectorAll('[data-t]').forEach(c => c.onclick = () => { S.tid = c.dataset.t; S.msg=''; renderReports(); });
}

function renderTicket(){
  const D = S.data, t = D.tickets.find(x => String(x.id) === String(S.tid));
  if (!t) { S.tid = null; return renderReports(); }
  const p = D.profiles[t.user_id] || {};
  const st = t.status || 'open';
  shell(`
    <button id="back">← Back</button>
    <h2>${esc(t.subject || 'Issue')}</h2>
    <div class="card">
      <div class="kv"><span>From</span><span>${esc(p.full_name || '—')}</span><span>Role</span><span>${esc(t.user_role || p.role || '—')}</span>
      <span>Phone</span><span>${esc(p.phone || '—')}</span><span>Email</span><span>${esc(p.email || '—')}</span>
      <span>Date</span><span>${fmtDate(t.created_at)}</span><span>Status</span><span class="tag ${esc(st)}" style="width:fit-content">${esc(st)}</span></div>
      <p>${esc(t.message || '')}</p>
      ${t.admin_reply ? `<div class="mu">Your note: ${esc(t.admin_reply)}</div>` : ''}
    </div>
    <div class="card">
      <textarea id="rp" rows="3" placeholder="Reply / note to the user">${esc(t.admin_reply || '')}</textarea>
      <div class="acts">
        ${st !== 'resolved' ? '<button class="p" id="res">Save & resolve</button>' : '<button id="reo">Reopen</button>'}
        <button id="sv">Save note</button>
      </div>
    </div>`);
  document.getElementById('back').onclick = () => { S.tid = null; S.msg=''; renderReports(); };
  const save = async status => {
    const { data, error } = await sb.from('support_tickets')
      .update({ admin_reply: document.getElementById('rp').value.trim() || null, status, updated_at: new Date().toISOString() })
      .eq('id', t.id).select();
    if (error) { flash(error.message); return renderTicket(); }
    if (!data.length) { flash('Update was blocked. Run the support SQL.'); return renderTicket(); }
    await loadAll(); flash('Saved.', 'ok'); S.tid = null; renderReports();
  };
  const res = document.getElementById('res'), reo = document.getElementById('reo');
  if (res) res.onclick = () => save('resolved');
  if (reo) reo.onclick = () => save('open');
  document.getElementById('sv').onclick = () => save(st);
}

/* ---------- settings: disable / block / delete ---------- */
function acctOf(id){ return S.data.status[id]?.status || 'active'; }

function renderSettings(){
  if (S.uid) return renderUser();
  const isOwner = p => String(p.role || '').toLowerCase().includes('owner');
  const base = Object.values(S.data.profiles).filter(p => p.email !== ADMIN_EMAIL);
  const nD = base.filter(p => !isOwner(p)).length, nO = base.filter(isOwner).length;
  const label = S.swho === 'owners' ? 'owner' : 'driver';
  shell(`
    <h2>Manage users</h2>
    <div class="subs">
      <button data-sw="drivers" class="${S.swho==='drivers'?'on':''}">Drivers (${nD})</button>
      <button data-sw="owners" class="${S.swho==='owners'?'on':''}">Owners (${nO})</button>
    </div>
    ${S.sstat ? `<div class="mu">Showing ${S.sstat} users (drivers and owners). Tap Drivers or Owners to clear.</div>` : `<div class="mu">Search a ${label}, then disable, block or delete them.</div>`}
    <input id="q" placeholder="Search ${label} name, email or phone" value="${esc(S.q)}">
    <div id="ul"></div>`);
  const draw = () => {
    const q = S.q.trim().toLowerCase();
    const all = S.sstat ? base.filter(p => acctOf(p.id) === S.sstat) : base.filter(p => S.swho === 'owners' ? isOwner(p) : !isOwner(p));
    const list = all.filter(p => !q || [p.full_name, p.email, p.phone].some(v => String(v || '').toLowerCase().includes(q))).slice(0, 40);
    document.getElementById('ul').innerHTML = list.length ? list.map(p => `
      <div class="card click" data-u="${esc(p.id)}">
        <div class="row"><b>${esc(p.full_name || 'No name')}</b><span class="tag ${acctOf(p.id)}">${acctOf(p.id)}</span></div>
        <div class="mu">${esc(p.email || '')} · ${esc(p.phone || '')}</div></div>`).join('') : `<div class="mu">No ${label}s found.</div>`;
    app.querySelectorAll('[data-u]').forEach(c => c.onclick = () => { S.uid = c.dataset.u; S.msg=''; renderSettings(); });
  };
  app.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { S.swho = b.dataset.sw; S.q = ''; S.sstat = ''; S.msg=''; renderSettings(); });
  document.getElementById('q').oninput = e => { S.q = e.target.value; draw(); };
  draw();
}

async function setAcct(uid, status, reason){
  const { error } = await sb.from('user_status').upsert({ user_id: uid, status, reason: reason || null, updated_at: new Date().toISOString() });
  return error ? error.message : null;
}

function renderUser(){
  const p = S.data.profiles[S.uid];
  if (!p) { S.uid = null; return renderSettings(); }
  const st = acctOf(p.id), why = S.data.status[p.id]?.reason;
  shell(`
    <button id="back">← Back</button>
    <h2>${esc(p.full_name || 'User')}</h2>
    <div class="card"><div class="kv"><span>Role</span><span>${esc(p.role || '—')}</span><span>Phone</span><span>${esc(p.phone || '—')}</span>
      <span>Email</span><span>${esc(p.email || '—')}</span><span>Age</span><span>${esc(p.age || '—')}</span><span>Address</span><span>${esc(p.address || '—')}</span><span>Account</span><span class="tag ${st}" style="width:fit-content">${st}</span></div>
      ${why ? `<div class="mu">Reason: ${esc(why)}</div>` : ''}</div>
    <div class="card">
      <textarea id="why" rows="2" placeholder="Reason (kept on record)"></textarea>
      <div class="acts">
        ${st !== 'active' ? '<button class="p" id="act">Reactivate</button>' : ''}
        ${st !== 'disabled' ? '<button class="w" id="dis">Disable</button>' : ''}
        ${st !== 'blocked' ? '<button class="d" id="blk">Block</button>' : ''}
      </div>
      <div class="mu" style="margin-top:10px">Disable: temporary, can be reactivated. Block: cannot log in.</div>
    </div>
    <div class="card"><b>Password</b>
      <div class="mu">Sends the user an email with a link to choose a new password. You never see their password. Not for Google sign-ins.</div>
      <div class="acts"><button class="w" id="pwreset">Send password reset email</button></div></div>
    <div class="card"><b>Onboarding: ${p.onboarded ? 'done' : 'not done'}</b>
      <div class="mu">For testing. Skip marks them as verified so they go straight into the app. Restart deletes their personal documents (ID, selfie, licence and so on, not vehicle photos) and shows them the onboarding screens again at next login.</div>
      <div class="acts"><button class="p" id="obskip">Skip onboarding</button><button class="w" id="obreset">Restart onboarding</button></div></div>
    <div class="card"><b>Delete user</b>
      <div class="mu">Removes their profile, vehicles, documents and driver data, and blocks the login. Cannot be undone.</div>
      <div class="acts"><button class="d" id="del">Delete user</button></div></div>`);
  document.getElementById('back').onclick = () => { S.uid = null; S.msg=''; renderSettings(); };
  const change = async status => {
    const e = await setAcct(p.id, status, document.getElementById('why').value.trim());
    if (e) { flash(e.includes('row-level') ? 'Blocked by policy. Run the support SQL.' : e); return renderUser(); }
    await loadAll(); flash(`User is now ${status}.`, 'ok'); renderUser();
  };
  const a = document.getElementById('act'), d = document.getElementById('dis'), b = document.getElementById('blk');
  if (a) a.onclick = () => change('active');
  if (d) d.onclick = () => change('disabled');
  if (b) b.onclick = () => change('blocked');
  const ob = async (done, clear) => {
    if (clear) { const r = await sb.from('documents').delete().eq('user_id', p.id).is('vehicle_id', null); if (r.error) { flash(r.error.message); return renderUser(); } }
    const { error } = await sb.rpc('admin_set_onboarding', { p_user: p.id, p_done: done });
    if (error) { flash(error.message.includes('function') ? 'Run admin_onboarding.sql in Supabase first.' : error.message); return renderUser(); }
    await loadAll(); flash(done ? 'Onboarding skipped. They go straight in.' : 'Onboarding restarted. They will see it at next login.', 'ok'); renderUser();
  };
  document.getElementById('pwreset').onclick = async () => {
    if (!p.email) { flash('This user has no email on file.'); return renderUser(); }
    if (!confirm('Send a password reset email to ' + p.email + '?')) return;
    const { error } = await sb.auth.resetPasswordForEmail(p.email);
    flash(error ? error.message : 'Reset email sent to ' + p.email + '.', error ? 'err' : 'ok'); renderUser();
  };
  document.getElementById('obskip').onclick = () => ob(true, false);
  document.getElementById('obreset').onclick = () => { if (confirm('Restart onboarding for this user? Their personal documents will be deleted.')) ob(false, true); };
  document.getElementById('del').onclick = async () => {
    if (!confirm('Delete this user and all their data? This cannot be undone.')) return;
    const e = await setAcct(p.id, 'blocked', 'Deleted by admin');
    if (e) { flash(e); return renderUser(); }
    const vids = S.data.vehicles.filter(v => v.owner_id === p.id).map(v => v.id);
    let n = 0, fails = 0;
    const del = async q => { const r = await q.select(); if (r.error) fails++; else n += r.data.length; };
    await del(sb.from('documents').delete().eq('user_id', p.id));
    if (vids.length) await del(sb.from('documents').delete().in('vehicle_id', vids));
    await del(sb.from('vehicles').delete().eq('owner_id', p.id));
    await del(sb.from('driver_profiles').delete().eq('user_id', p.id));
    await del(sb.from('profiles').delete().eq('id', p.id));
    await loadAll(); S.uid = null;
    flash(`Deleted ${n} records and blocked the login.` + (fails ? ` ${fails} step(s) failed (linked data or missing delete policy).` : ''), fails ? 'err' : 'ok');
    renderSettings();
  };
}

/* ---------- start ---------- */
/* ---------- messages to drivers / owners ---------- */
function renderMessages(){
  const who = { all:'all drivers and owners', drivers:'all drivers', owners:'all owners' };
  shell(`
    <h2>Send a message</h2>
    <div class="mu">It pops up on their screen with an Okay button, and stays in their Alerts.</div>
    <select id="ma">
      <option value="all">Everyone (drivers and owners)</option>
      <option value="drivers">Drivers only</option>
      <option value="owners">Owners only</option>
    </select>
    <input id="mt" maxlength="80" placeholder="Title, e.g. Important update" value="${esc(S.mt)}">
    <textarea id="mb" rows="6" placeholder="Write your message…">${esc(S.mb)}</textarea>
    <div class="acts"><button class="p" id="send">Send message</button></div>`);
  const ma = document.getElementById('ma'), mt = document.getElementById('mt'), mb = document.getElementById('mb');
  ma.value = S.ma;
  ma.onchange = () => S.ma = ma.value;
  mt.oninput = () => S.mt = mt.value;
  mb.oninput = () => S.mb = mb.value;
  document.getElementById('send').onclick = async () => {
    const title = S.mt.trim(), body = S.mb.trim();
    if (!title || !body) { flash('Add a title and a message first.'); return renderMessages(); }
    if (!confirm('Send this to ' + who[S.ma] + '?')) return;
    const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Sending…';
    const { data, error } = await sb.rpc('admin_broadcast', { p_title: title, p_body: body, p_audience: S.ma });
    if (error) { flash(error.message); return renderMessages(); }
    S.mt = ''; S.mb = '';
    flash('Sent to ' + data + ' ' + (data === 1 ? 'person' : 'people') + '.', 'ok');
    renderMessages();
  };
}
async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  app.innerHTML = '<div class="mu">Loading…</div>';
  try {
    await loadAll();
    render();
  } catch (e) {
    app.innerHTML = `<div class="top"><h1>DriverMatch Admin</h1><button id="out">Log out</button></div>
      <div class="err">${esc(e.message)}</div><div class="mu">If this says permission denied or returns nothing, run the admin SQL.</div>`;
    document.getElementById('out').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  }
}
start();
</script>
