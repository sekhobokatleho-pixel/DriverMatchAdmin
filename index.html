<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriverMatch Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--g:#0f7a4a;--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e0e5ec;--rd:#c0392b;--am:#b7791f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:14px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.err{color:var(--rd);margin:8px 0;font-size:15px}
.ok{color:var(--g);margin:8px 0;font-size:15px}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;margin:6px 0;font-family:inherit}
button{font-size:15px;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:9px 13px;cursor:pointer;color:var(--tx);font-family:inherit}
button.p{background:var(--g);color:#fff;border-color:var(--g)}
button.d{background:var(--rd);color:#fff;border-color:var(--rd)}
button.sm{padding:6px 10px;font-size:14px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.nav button{white-space:nowrap;flex:0 0 auto}
.nav button.on,.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.chips{display:flex;gap:6px;margin:8px 0 12px;overflow-x:auto}
.chips button{flex:1 0 auto;padding:8px 10px;font-size:14px;white-space:nowrap}
.badge{background:var(--rd);color:#fff;border-radius:20px;font-size:11px;padding:1px 6px;margin-left:5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card.click{cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:#eef1f5;color:var(--mu);margin-left:4px}
.tag.pending,.tag.open{background:#fdf3dc;color:var(--am)}
.tag.approved,.tag.accepted,.tag.resolved,.tag.paid{background:#e6f4ec;color:var(--g)}
.tag.rejected,.tag.declined,.tag.blocked{background:#fbe6e3;color:var(--rd)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:15px;margin:8px 0;word-break:break-word}
.kv span:nth-child(odd){color:var(--mu)}
.doc{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.doc img{max-width:100%;border-radius:8px;margin-top:8px;display:block}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{font-size:24px;display:block}
.banner{background:#fdf3dc;border:1px solid #ecd9a0;border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px}
.setrow{display:flex;gap:8px;align-items:center}
.setrow input{margin:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const app = document.getElementById('app');
const C = window.DM || {};
if (typeof supabase === 'undefined') { app.innerHTML = '<p style="color:#c0392b">The Supabase library did not load. Check your connection and reload.</p>'; throw new Error('supabase library missing'); }
if (!window.DM) { app.innerHTML = '<p style="color:#c0392b">config.js did not load. Upload config.js into the same folder as index.html in GitHub, then reload.</p>'; throw new Error('config.js missing'); }
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
window.addEventListener('error', e => { app.insertAdjacentHTML('afterbegin', '<p style="color:#c0392b">Error: ' + String(e.message).replace(/</g,'&lt;') + '</p>'); });
const VIEWS = [['home','Home'],['drivers','Drivers'],['owners','Owners'],['matches','Matches'],['payments','Payments'],['reports','Reports'],['settings','Settings']];
const S = { view:'home', sec:'pending', openId:null, q:'', mstat:'all', rstat:'open', data:null, errs:[], msg:'', msgType:'err' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const low = s => String(s || '').toLowerCase();
const norm = s => { s = low(s) || 'pending'; if (s === 'approved' || s === 'verified') return 'approved'; if (s === 'rejected') return 'rejected'; return 'pending'; };
const fdate = d => d ? new Date(d).toLocaleDateString('en-ZA') : '';
const rand = c => 'R' + ((c || 0) / 100).toFixed(2);
const flash = (m, t) => { S.msg = m; S.msgType = t || 'err'; };
const PAID = ['paid','complete','completed','success','successful'];

/* ---------- login ---------- */
function renderLogin(err){
  app.innerHTML = `<div class="top"><h1>DriverMatch Admin</h1></div>
  <div class="card">
    <input id="em" type="email" placeholder="Admin email" autocomplete="username" value="${esc(C.ADMIN_EMAIL)}">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err">${esc(err || '')}</div>
    <button class="p" id="go">Log in</button>
  </div>`;
  document.getElementById('go').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
    if (error) return renderLogin(error.message);
    start();
  };
}

/* ---------- data ---------- */
async function loadAll(){
  S.errs = [];
  const T = async (n, ord) => {
    let q = sb.from(n).select('*'); if (ord) q = q.order(ord, { ascending:false });
    const r = await q; if (r.error) { S.errs.push(n + ': ' + r.error.message); return []; } return r.data || [];
  };
  const [dp, pr, vh, dc, rq, py, rp, st] = await Promise.all([
    T('driver_profiles'), T('profiles'), T('vehicles'), T('documents','created_at'),
    T('requests','created_at'), T('payments','created_at'), T('reports','created_at'), T('settings')
  ]);
  const profiles = {}; pr.forEach(p => profiles[p.id] = p);
  const vmap = {}; vh.forEach(v => vmap[v.id] = v);
  S.data = { drivers:dp, vehicles:vh, docs:dc, reqs:rq, pays:py, reports:rp, settings:st, profiles, vmap };
}
const nm = id => { const p = S.data.profiles[id]; return p ? (p.full_name || p.email || 'User') : 'Unknown'; };
const vcode = id => S.data.vmap[id]?.vehicle_code || 'Vehicle';

async function notify(uid, title, body){
  const { error } = await sb.from('notifications').insert({ user_id: uid, title, body, is_read: false });
  return !error;
}

/* ---------- shell ---------- */
function shell(inner){
  const D = S.data;
  const openR = D.reports.filter(r => rnorm(r.status) === 'open').length;
  const badge = v => v === 'drivers' ? cntBadge(D.drivers.filter(d => d.verification_status === 'pending').length)
    : v === 'owners' ? cntBadge(D.vehicles.filter(x => norm(x.status) === 'pending').length)
    : v === 'reports' ? cntBadge(openR) : '';
  app.innerHTML = `<div class="top"><h1>DriverMatch Admin</h1><button class="sm" data-act="logout">Log out</button></div>
  <div class="nav">${VIEWS.map(([v,l]) => `<button data-act="nav" data-v="${v}" class="${S.view===v?'on':''}">${l}${badge(v)}</button>`).join('')}</div>
  ${S.errs.length ? `<div class="banner"><b>Some data could not load:</b><br>${S.errs.map(esc).join('<br>')}<br>Run the admin SQL, then tap Refresh on Home.</div>` : ''}
  <div class="${S.msgType}">${esc(S.msg)}</div>${inner}`;
}
const cntBadge = n => n ? `<span class="badge">${n}</span>` : '';

function render(){
  if (S.openId && (S.view === 'drivers' || S.view === 'owners')) return renderDetail();
  const fn = { home:vHome, drivers:vPeople, owners:vPeople, matches:vMatches, payments:vPayments, reports:vReports, settings:vSettings }[S.view];
  shell(fn());
  if (S.view === 'drivers' || S.view === 'owners') renderPeopleList();
  if (S.view === 'matches') renderMatchList();
}

/* ---------- home ---------- */
function vHome(){
  const D = S.data;
  const dr = D.drivers.filter(d => d.verification_status !== 'incomplete');
  const paid = D.pays.filter(p => PAID.includes(low(p.status)));
  const income = paid.reduce((a, p) => a + (p.amount_cents || 0), 0);
  const box = (n, l) => `<div class="card stat"><b>${n}</b><span class="mu">${l}</span></div>`;
  return `<div class="stats">
    ${box(dr.length, 'Drivers')}
    ${box(dr.filter(d => d.verification_status === 'pending').length, 'Drivers pending')}
    ${box(D.vehicles.length, 'Vehicles')}
    ${box(D.vehicles.filter(v => norm(v.status) === 'pending').length, 'Vehicles pending')}
    ${box(D.reqs.filter(r => r.status === 'pending').length, 'Requests pending')}
    ${box(D.reqs.filter(r => r.status === 'accepted').length, 'Matches made')}
    ${box(D.reports.filter(r => rnorm(r.status) === 'open').length, 'Open reports')}
    ${box(rand(income), 'Income (' + paid.length + ' payments)')}
  </div><div class="acts"><button data-act="refresh">Refresh data</button></div>`;
}

/* ---------- people (drivers / owners) ---------- */
function people(){
  const D = S.data;
  if (S.view === 'drivers') return D.drivers.filter(d => d.verification_status !== 'incomplete').map(d => {
    const p = D.profiles[d.user_id] || {};
    return { id:d.user_id, uid:d.user_id, status:norm(d.verification_status), reason:d.rejection_reason,
      title:p.full_name || d.driver_code || 'Driver', place:[d.suburb, d.city].filter(Boolean).join(', '),
      blocked:!!p.blocked, raw:d, p, hay:low([p.full_name, p.phone, p.email, d.driver_code, d.suburb, d.city].join(' ')) };
  });
  return D.vehicles.map(v => {
    const p = D.profiles[v.owner_id] || {};
    return { id:v.id, uid:v.owner_id, status:norm(v.status), reason:v.rejection_reason,
      title:`${v.vehicle_code || 'Vehicle'} · ${[v.make, v.model, v.year].filter(Boolean).join(' ')}`,
      owner:p.full_name || 'Owner', place:[v.suburb, v.city].filter(Boolean).join(', '),
      blocked:!!p.blocked, raw:v, p, hay:low([p.full_name, p.phone, p.email, v.vehicle_code, v.make, v.model, v.suburb, v.city].join(' ')) };
  });
}
function vPeople(){
  return `<input id="q" data-search="people" placeholder="Search name, phone, email, code, area" value="${esc(S.q)}"><div id="list"></div>`;
}
function renderPeopleList(){
  const q = low(S.q).trim();
  const all = people(); const base = q ? all.filter(i => i.hay.includes(q)) : all;
  const cnt = k => base.filter(i => i.status === k).length;
  const list = base.filter(i => i.status === S.sec);
  document.getElementById('list').innerHTML = `
    <div class="chips">${['pending','approved','rejected'].map(k => `<button data-act="sec" data-s="${k}" class="${S.sec===k?'on':''}">${k[0].toUpperCase()+k.slice(1)} (${cnt(k)})</button>`).join('')}</div>
    ${list.length ? list.map(i => `<div class="card click" data-act="open" data-id="${esc(i.id)}">
      <div class="row"><b>${esc(i.title)}</b><span>${i.blocked ? '<span class="tag blocked">blocked</span>' : ''}<span class="tag ${i.status}">${i.status}</span></span></div>
      ${S.view === 'owners' ? `<div class="mu">Owner: ${esc(i.owner)}</div>` : `<div class="mu">${esc(i.p.phone || '')}</div>`}
      <div class="mu">${esc(i.place || 'No location')}</div></div>`).join('') : `<div class="mu">Nothing in ${S.sec}.</div>`}`;
}

async function renderDetail(){
  const D = S.data;
  const it = people().find(i => String(i.id) === String(S.openId));
  if (!it) { S.openId = null; return render(); }
  let docs, kv;
  const p = it.p;
  if (S.view === 'drivers') {
    docs = D.docs.filter(d => d.user_id === it.raw.user_id);
    kv = [['Name', p.full_name], ['Phone', p.phone], ['Email', p.email], ['Driver code', it.raw.driver_code], ['Licence', it.raw.licence_type],
      ['Location', it.place], ['Weekly offer', it.raw.weekly_offer ? 'R' + it.raw.weekly_offer : ''], ['Joined', fdate(it.raw.created_at)]];
  } else {
    const v = it.raw;
    docs = D.docs.filter(d => d.vehicle_id === v.id || (d.user_id === v.owner_id && !d.vehicle_id));
    kv = [['Owner', p.full_name], ['Phone', p.phone], ['Email', p.email], ['Vehicle', `${v.vehicle_code || ''} (${v.vehicle_type || ''})`],
      ['Make / model', [v.make, v.model, v.year].filter(Boolean).join(' ')], ['Kms', v.kms], ['Location', it.place], ['Weekly amount', v.weekly_amount ? 'R' + v.weekly_amount : '']];
  }
  shell(`<div class="top"><button data-act="back">← Back</button><span>${it.blocked ? '<span class="tag blocked">blocked</span>' : ''}<span class="tag ${it.status}">${it.status}</span></span></div>
    <h2>${esc(it.title)}</h2>
    <div class="card"><div class="kv">${kv.map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v || '—')}</span>`).join('')}</div>
      ${it.reason ? `<div class="err">Reason: ${esc(it.reason)}</div>` : ''}</div>
    <h2>Documents (${docs.length})</h2><div id="docs"><div class="mu">Loading documents…</div></div>
    <div class="card"><textarea id="why" rows="2" placeholder="Reason (required for rejecting or revoking; sent to the user)"></textarea>
      <div class="acts">
        ${it.status !== 'approved' ? '<button class="p" data-act="setstat" data-to="approved">Approve</button>' : ''}
        ${it.status === 'approved' ? '<button class="d" data-act="setstat" data-to="rejected">Revoke</button>' : ''}
        ${it.status === 'pending' ? '<button class="d" data-act="setstat" data-to="rejected">Reject</button>' : ''}
        <button data-act="block" data-to="${it.blocked ? 'no' : 'yes'}">${it.blocked ? 'Unblock user' : 'Block user'}</button>
      </div></div>`);
  const box = document.getElementById('docs');
  if (!docs.length) { box.innerHTML = '<div class="mu">No documents uploaded.</div>'; return; }
  box.innerHTML = (await Promise.all(docs.map(async d => {
    const { data, error } = await sb.storage.from(C.DOC_BUCKET).createSignedUrl(d.file_path, 900);
    const url = data?.signedUrl; const isImg = /\.(jpe?g|png|gif|webp)$/i.test(d.file_path || ''); const ds = norm(d.status);
    return `<div class="doc"><div class="row"><b>${esc((d.doc_type || 'document').replace(/_/g, ' '))}</b><span class="tag ${ds}">${ds}</span></div>
      <div class="mu">${fdate(d.created_at)}${d.admin_note ? ' · Note: ' + esc(d.admin_note) : ''}</div>
      ${error ? `<div class="err">Cannot open file: ${esc(error.message)}</div>` : (isImg ? `<a href="${url}" target="_blank"><img src="${url}" alt="document"></a>` : `<a href="${url}" target="_blank">Open file</a>`)}
      <div class="acts"><button class="sm p" data-act="docset" data-id="${esc(d.id)}" data-to="approved">Approve doc</button><button class="sm d" data-act="docset" data-id="${esc(d.id)}" data-to="rejected">Reject doc</button></div></div>`;
  }))).join('');
}

async function setPerson(to){
  const it = people().find(i => String(i.id) === String(S.openId)); if (!it) return;
  const why = (document.getElementById('why')?.value || '').trim();
  if (to === 'rejected' && !why) return flashDetail('Please type a reason first.');
  const isD = S.view === 'drivers';
  const patch = isD ? { verification_status: to === 'approved' ? 'verified' : 'rejected', rejection_reason: to === 'approved' ? null : why }
                    : { status: to, rejection_reason: to === 'approved' ? null : why };
  const { data, error } = await (isD ? sb.from('driver_profiles').update(patch).eq('user_id', it.raw.user_id) : sb.from('vehicles').update(patch).eq('id', it.raw.id)).select();
  if (error) return flashDetail(error.message);
  if (!data || !data.length) return flashDetail('Update was blocked. Run the admin SQL.');
  const label = isD ? 'profile' : 'vehicle ' + (it.raw.vehicle_code || '');
  const sent = await notify(it.uid, to === 'approved' ? `Your ${label} was approved` : `Your ${label} was not approved`,
    to === 'approved' ? 'You are now approved on DriverMatch.' : 'Reason: ' + why);
  await loadAll(); S.sec = to; S.openId = null;
  flash(`Moved to ${to}.` + (sent ? ' User notified.' : ' (Could not notify the user; check the notifications policy.)'), sent ? 'ok' : 'err');
  render();
}
function flashDetail(m){ S.msg = m; S.msgType = 'err'; renderDetail(); }

async function setDoc(id, to){
  let note = null;
  if (to === 'rejected') { note = (prompt('Why is this document rejected?') || '').trim(); if (!note) return; }
  const { data, error } = await sb.from('documents').update({ status: to, admin_note: note }).eq('id', id).select();
  if (error) return flashDetail(error.message);
  if (!data || !data.length) return flashDetail('Document update was blocked. Run the admin SQL.');
  const d = S.data.docs.find(x => x.id === id);
  if (d) { d.status = to; d.admin_note = note; if (to === 'rejected') await notify(d.user_id, 'A document needs attention', `${(d.doc_type || 'Document').replace(/_/g, ' ')}: ${note}`); }
  flash(`Document ${to}.`, 'ok'); renderDetail();
}

async function setBlock(to){
  const it = people().find(i => String(i.id) === String(S.openId)); if (!it) return;
  const { data, error } = await sb.from('profiles').update({ blocked: to === 'yes' }).eq('id', it.uid).select();
  if (error) return flashDetail(error.message + ' (run the admin SQL to add the blocked column)');
  if (!data || !data.length) return flashDetail('Blocked. Run the admin SQL.');
  S.data.profiles[it.uid].blocked = (to === 'yes');
  flash(to === 'yes' ? 'User blocked.' : 'User unblocked.', 'ok'); renderDetail();
}

/* ---------- matches ---------- */
function vMatches(){
  return `<input id="q" data-search="matches" placeholder="Search driver, owner or vehicle" value="${esc(S.q)}"><div id="list"></div>`;
}
function renderMatchList(){
  const D = S.data, q = low(S.q).trim();
  const rows = D.reqs.map(r => {
    const v = D.vmap[r.vehicle_id] || {};
    return { r, driver: nm(r.driver_id), owner: nm(v.owner_id), code: v.vehicle_code || 'Vehicle', hay: low([nm(r.driver_id), nm(v.owner_id), v.vehicle_code].join(' ')) };
  }).filter(x => !q || x.hay.includes(q));
  const stats = ['all','pending','accepted','declined','cancelled'];
  const list = rows.filter(x => S.mstat === 'all' || x.r.status === S.mstat);
  document.getElementById('list').innerHTML = `
    <div class="chips">${stats.map(k => `<button data-act="mstat" data-s="${k}" class="${S.mstat===k?'on':''}">${k[0].toUpperCase()+k.slice(1)} (${k === 'all' ? rows.length : rows.filter(x => x.r.status === k).length})</button>`).join('')}</div>
    ${list.length ? list.map(x => `<div class="card"><div class="row"><b>${esc(x.driver)} ↔ ${esc(x.code)}</b><span class="tag ${x.r.status}">${x.r.status}</span></div>
      <div class="mu">Owner: ${esc(x.owner)}</div><div class="mu">Started by ${esc(x.r.initiated_by)} · ${fdate(x.r.created_at)}${x.r.responded_at ? ' · Responded ' + fdate(x.r.responded_at) : ''}</div></div>`).join('') : '<div class="mu">No requests here.</div>'}`;
}

/* ---------- payments ---------- */
function vPayments(){
  const D = S.data; const paid = D.pays.filter(p => PAID.includes(low(p.status)));
  const total = paid.reduce((a, p) => a + (p.amount_cents || 0), 0);
  return `<div class="card"><b>${rand(total)}</b> <span class="mu">received from ${paid.length} paid of ${D.pays.length} payments</span></div>
    ${D.pays.length ? D.pays.map(p => `<div class="card"><div class="row"><b>${rand(p.amount_cents)}</b><span class="tag ${PAID.includes(low(p.status)) ? 'paid' : ''}">${esc(p.status || 'unknown')}</span></div>
      <div class="mu">${esc(nm(p.user_id))} · ${esc(p.kind || '')}${p.vehicle_id ? ' · ' + esc(vcode(p.vehicle_id)) : ''}</div>
      <div class="mu">${fdate(p.created_at)}${p.pf_payment_id ? ' · PayFast ' + esc(p.pf_payment_id) : ''}</div></div>`).join('') : '<div class="mu">No payments yet.</div>'}`;
}

/* ---------- reports ---------- */
const rnorm = s => { s = low(s); return s === 'resolved' ? 'resolved' : s === 'reviewed' ? 'reviewed' : 'open'; };
function vReports(){
  const D = S.data; const all = D.reports;
  const chips = ['open','reviewed','resolved','all']
  start();
</script>
</body>
</html>
