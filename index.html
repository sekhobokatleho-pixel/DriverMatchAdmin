<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriverMatch Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#0f7a4a;--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e0e5ec;--rd:#c0392b;--am:#b7791f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:12px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.err{color:var(--rd);margin:8px 0;font-size:15px}
.ok{color:var(--g);margin:8px 0;font-size:15px}
.banner{background:#fdf3dc;border:1px solid #f0dca8;color:#7a5a12;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;margin:6px 0;font-family:inherit;background:#fff;color:var(--tx)}
button{font-size:16px;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:10px 14px;cursor:pointer;color:var(--tx);font-family:inherit}
button.sm{padding:6px 10px;font-size:14px}
button.p{background:var(--g);color:#fff;border-color:var(--g)}
button.d{background:var(--rd);color:#fff;border-color:var(--rd)}

/* top navigation (scrolls sideways on small screens) */
.nav{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.nav button{flex:0 0 auto;padding:8px 12px;font-size:15px;white-space:nowrap}
.nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
.badge{display:inline-block;min-width:18px;margin-left:6px;padding:1px 6px;border-radius:20px;background:var(--rd);color:#fff;font-size:12px;text-align:center}
.nav button.on .badge{background:#fff;color:var(--g)}

/* filter chips */
.chips{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.chips button{padding:7px 12px;font-size:14px}
.chips button.on{background:#e6f4ec;border-color:var(--g);color:var(--g);font-weight:600}

/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card.click{cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mu{color:var(--mu);font-size:14px}

/* home stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{margin:0;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:24px}

/* status tags */
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:#eef1f5;color:var(--mu);margin-right:4px}
.tag.pending,.tag.open{background:#fdf3dc;color:var(--am)}
.tag.approved,.tag.accepted,.tag.paid,.tag.resolved{background:#e6f4ec;color:var(--g)}
.tag.rejected,.tag.declined,.tag.cancelled,.tag.blocked{background:#fbe6e3;color:var(--rd)}
.tag.reviewed{background:#e3edfb;color:#2a5db0}

/* details */
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:15px;margin:8px 0}
.kv span:nth-child(odd){color:var(--mu)}
.doc{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.doc img{max-width:100%;border-radius:8px;margin-top:8px;display:block}
.doc a{display:inline-block;margin-top:6px;color:var(--g)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* settings */
.setrow{display:flex;align-items:center;gap:8px}
.setrow input{margin:0;flex:1}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="mu">Loading…</div></div>

<!-- Order matters: config first, then js1 (core), js2 (drivers/owners), js3 (matches, payments, reports, settings, start) -->
<script src="config.js"></script>
<script src="js1.js"></script>
<script src="js2.js"></script>
<script src="js3.js"></script>
</body>
</html>
